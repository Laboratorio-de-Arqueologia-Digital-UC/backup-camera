name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter wmi blake3 pillow pyinstaller
        pip install -e .
        
    - name: Lint with Ruff
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Type Check with Pyright
      run: |
        uv run pyright .

    - name: Run Tests
      run: |
        uv run pytest tests
        
    - name: Build Executable
      run: |
        python build.py
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: BackupCamera-EXE
        path: dist/*.exe
