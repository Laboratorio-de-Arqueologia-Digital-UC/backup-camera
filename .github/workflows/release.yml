name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: |
        uv venv
        uv pip install customtkinter wmi blake3 pillow pyinstaller commitizen
        uv pip install -e .

    - name: Run Tests
      run: |
        uv run pytest tests

    - name: Build Executable
      run: |
        uv run python build.py

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/BackupCamera_*.exe
        generate_release_notes: true
