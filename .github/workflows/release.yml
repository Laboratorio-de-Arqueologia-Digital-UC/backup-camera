name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente a construir y publicar (ej: v3.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: |
        uv venv
        uv pip install customtkinter wmi blake3 pillow pyinstaller commitizen
        uv pip install -e .

    - name: Run Tests
      run: |
        uv run pytest tests

    - name: Build Executable
      run: |
        uv run python build.py

    - name: List build output
      run: dir dist

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BackupCamera-EXE-${{ inputs.tag || github.ref_name }}
        path: dist/*.exe
        if-no-files-found: error

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag || github.ref_name }}
        files: dist/BackupCamera_*.exe
        fail_on_unmatched_files: true
        generate_release_notes: true
