[project]
name = "backup-camera"
version = "0.1.0"
description = "Forensic data ingestion tool for archaeological contexts"
authors = [
    {name = "Archaeology Lab", email = "lab@example.com"},
]
dependencies = [
    "customtkinter>=5.2.0",
    "wmi>=1.5.1",
    "blake3>=0.3.3",
    "pillow>=10.0.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.14.10",
    "pyright>=1.1.407",
    "commitizen>=4.10.1",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.4.2",
    "ruff>=0.14.10",
]
