[project]
name = "backup-camera"
version = "3.1.2"
description = "Forensic data ingestion tool for archaeological contexts"
authors = [
    {name = "Archaeology Lab", email = "lab@example.com"},
]
dependencies = [
    "customtkinter>=5.2.0",
    "wmi>=1.5.1",
    "blake3>=0.3.3",
    "pillow>=10.0.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.14.11",
    "pyright>=1.1.407",
    "commitizen>=4.10.1",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "Apache-2.0"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.4.2",
    "ruff>=0.14.11",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "3.1.2"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"
update_changelog_on_bump = true
